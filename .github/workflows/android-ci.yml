name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    container: gradle:8.3-jdk17
    steps:
      - uses: actions/checkout@v4
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating gradle wrapper using container gradle"
            gradle wrapper --gradle-version 8.3
            chmod +x ./gradlew
          else
            echo "gradlew already present"
          fi

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    container: gradle:8.3-jdk17
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating gradle wrapper using container gradle"
            gradle wrapper --gradle-version 8.3
            chmod +x ./gradlew
          else
            echo "gradlew already present"
          fi

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  native-harness:
    name: Native harness (host)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure & build native_test
        working-directory: ./wakeword
        run: |
          cmake -S . -B build -DBUILD_NATIVE_TEST=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target native_test -- -j2

      - name: Run native_test
        working-directory: ./wakeword/build
        run: |
          if [ -f ./native_test ]; then
            ./native_test
          else
            echo "native_test not found" && exit 1
          fi

# Placeholder: add a separate job for NDK builds when an Android NDK image is available.
# See https://developer.android.com/studio/command-line/adb for recommended runner setup.